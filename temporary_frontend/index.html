<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#141512">
    <meta name="description" content="Guess the song. Find your people. A music party game for your own screens.">
    <title>Who's On Repeat</title>
    <link rel="icon" href="/static/images/cover-placeholder.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/styles.css">
    <script type="module" src="/static/js/app.js"></script>
  </head>
  <body>
    <header class="masthead">
      <a class="wordmark" href="/" aria-label="Who's On Repeat home">W<span class="record-mark">●</span>R<span class="wordmark-period">.</span></a>
      <span class="masthead-note">GOOD MUSIC. QUESTIONABLE GUESSES.</span>
      <button class="text-button" id="leave-button" hidden>Leave room ↗</button>
    </header>
    <main id="app" aria-busy="true"></main>
    <div class="toast" id="notice" role="status" aria-live="polite" hidden></div>
    <footer class="footer"><span>WHO'S ON REPEAT</span><span>Everybody plays. The host brings the sound.</span><span>VOL. 01 / DEMO</span></footer>
    <noscript><p class="noscript">Enable JavaScript to join a game.</p></noscript>
  </body>
</html>
